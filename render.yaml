services:
  - type: web
    name: kit-voice-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    plan: starter
    disk:
      name: kit-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: COLLEGE_API_URL
        value: https://ht.knowvally.com
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/kit.db
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: COLLEGE_PARTICIPANT_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: JBFqnCBsd6RMkjVDRZzb
      - key: ELEVENLABS_MODEL_ID
        value: eleven_flash_v2_5
      - key: ELEVENLABS_OUTPUT_FORMAT
        value: mp3_44100_128
      - key: SESSION_SECRET
        generateValue: true
